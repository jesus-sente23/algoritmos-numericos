
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de programación</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<h1>Ejercicios de fase # 2</h1>

<!-- ejercicio 1 -->
<section>
    <h2>Ejercicio 1 - Número par o impar</h2>

    <label for="numero">Ingrese un número entero:</label>
    <input type="number" id="numero" step="1">

    <button onclick="verificarParImpar()">
        Verificar
    </button>

    <p id="resultado1"></p>
</section>

<hr>

<!-- ejercicio 2 -->
<section>
    <h2>Ejercicio 2 - Números primos en un rango</h2>

    <label for="numeroA">Número inicial (a):</label>
    <input type="number" id="numeroA" step="1">

    <br><br>

    <label for="numeroB">Número final (b):</label>
    <input type="number" id="numeroB" step="1">

    <br><br>

    <button onclick="mostrarPrimos()">
        Mostrar primos
    </button>

    <p id="resultado2"></p>
</section>

<hr>

<!-- ejercicio 3 -->
<section>
    <h2>Ejercicio 3 - Suma de términos pares de Fibonacci</h2>

    <label for="numeroFibonacci">
        Cantidad de términos:
    </label>

    <input type="number" id="numeroFibonacci" step="1">

    <button onclick="calcularFibonacci()">
        Calcular
    </button>

    <p id="resultado3"></p>
</section>

<script src="script.js"></script>

</body>
</html>
